name: LINE notify

on:
  push:
    branches:
      - main
    paths:
      - data/latest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes-data-main
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send LINE message
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python scripts/line_messaging.py --from-latest data/latest.json

      - name: Commit alert state
        run: |
          chmod +x .github/scripts/push_retry.sh
          .github/scripts/push_retry.sh "Update LINE alert state" data/alert_state.json
