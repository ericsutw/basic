name: Fallback quote fetch

on:
  schedule:
    # Safety net only. The assistant machine pushes fresh quotes;
    # this job fetches itself when data/latest.json is older than ~90 minutes.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes-data-main
  cancel-in-progress: false

jobs:
  fetch-if-stale:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check latest.json age
        id: freshness
        run: python scripts/latest_age.py --max-age-minutes 90

      - name: Install Google Chrome
        if: steps.freshness.outputs.stale == 'true'
        run: |
          if command -v google-chrome >/dev/null 2>&1 || command -v google-chrome-stable >/dev/null 2>&1 || command -v chromium >/dev/null 2>&1 || command -v chromium-browser >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb

      - name: Install dependencies
        if: steps.freshness.outputs.stale == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch quotes
        if: steps.freshness.outputs.stale == 'true'
        run: python scripts/fetch_quotes.py

      - name: Commit and push
        if: steps.freshness.outputs.stale == 'true'
        run: |
          chmod +x .github/scripts/push_retry.sh
          .github/scripts/push_retry.sh "Update quotes" \
            data/latest.json \
            data/gold_prices.csv \
            data/gold_prices_backup.csv \
            data/currency
